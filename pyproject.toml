[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-detection-laboratory"
version = "1.1.0"
description = "Fraud anomaly detection research and evaluation studio"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.3", "streamlit>=1.30", "openpyxl>=3.1", "pyarrow>=14", "skops>=0.12"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["fraud_detection*"]
